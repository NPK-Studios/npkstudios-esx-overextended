# Editable Settings
# -----------------
# You can edit the following:

{{serverEndpoints}}

# Hide player IP addresses from public server reports
sv_endpointPrivacy true

sv_licenseKey "{{svLicense}}"
set mysql_connection_string "{{dbConnectionString}}"
sv_maxclients {{maxClients}}

# Game build 3889 = mp2026_01 (The Kortz Center Heist)
# Can only be set at startup. List: https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild-build
sv_enforceGameBuild 3889
set resources_useSystemChat true

# Server Listing (Cfx Portal)
# ---------------------------
# Since 21 October 2026 the server list reads its details from the Cfx Portal,
# not from server.cfg. Set them at https://portal.cfx.re/ (the server attached to your sv_licenseKey):
#   Name / Tagline   -> replaces sv_hostname and sv_projectName
#   Description      -> replaces sv_projectDesc
#   Tags (max 5)     -> replaces sets tags
#   Language         -> replaces sets locale
#   Icon / Banner    -> replaces load_server_icon and banner_detail
#   Discord link     -> Social section
# Logo for the Portal: NPKStudios_logo.png (1080x1080) from this repository.

# System Administrators
# ---------------------
# Add system admins

add_principal group.admin group.user
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow
{{addPrincipalsMaster}}

# pma-voice Config
# ----------------
setr voice_enableRadioAnim 1
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

# security-convars
# ----------------
sv_enableNetworkedSounds false
sv_enableNetworkedScriptEntityStates false
sv_enableNetworkedPhoneExplosions false
sv_filterRequestControl 2

# ESX Language (edit to change the language of ESX)
# -----------------------------------------------------------
## Uncomment to set your own locale,
## if not, it will use the language you have selected in txAdmin.
#setr esx:locale "en"

## Uncomment to owerride the identifier used by ESX.
## By default, it uses the license identifier.
#setr esx:identifier "license"

# Overextended Resources Configuration
# -------------------------------------
exec overextended.cfg

# Default Resources
# -----------------
ensure chat
ensure hardcap

# Critical Loading Order
# ----------------------
# 1. ox_lib - Core library (must be first)
ensure ox_lib

# 2. oxmysql - Database
ensure oxmysql

# 3. ESX Core - Framework (esx_lib is required by es_extended since ESX 1.16)
ensure esx_lib
ensure es_extended
ensure [core]

# 4. ox_target - Targeting system
ensure ox_target

# 5. Other Overextended Resources
ensure ox_inventory
ensure ox_fuel
ensure ox_doorlock

# 6. Standalone & ESX Addons
ensure [standalone]
ensure [esx_addons]
